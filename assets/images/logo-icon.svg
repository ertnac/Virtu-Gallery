<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Gallery Velvet Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243321"/>
      <stop offset="50%" stop-color="#1a2417"/>
      <stop offset="100%" stop-color="#10170f"/>
    </linearGradient>

    <!-- Metallic Antique Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cd"/>
      <stop offset="25%" stop-color="#e2bf65"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="75%" stop-color="#9d7632"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <!-- Accent Light Reflection -->
    <linearGradient id="reflectionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#d4af37" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Base Badge -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#softGlow)"/>

  <!-- Inner Delicate Frame Border (Gallery Wall Metaphor) -->
  <rect x="52" y="52" width="408" height="408" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Inner Golden Corner Accents -->
  <path d="M 72 108 L 72 72 L 108 72" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 440 108 L 440 72 L 404 72" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 72 404 L 72 440 L 108 440" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 440 404 L 440 440 L 404 440" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Geometric Artwork Frame (Rotated 45-degree diamond canvas) -->
  <polygon points="256,104 380,256 256,408 132,256" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.45"/>

  <!-- Stylized Monogram 'V' & Paint Stroke Intersect -->
  <!-- Left Serif Wing of 'V' -->
  <path d="M 148 152 
           C 160 152, 172 160, 180 176 
           L 256 364 
           L 236 364 
           L 136 172 
           C 130 160, 126 156, 116 152 
           Z" 
        fill="url(#goldGrad)"/>

  <!-- Right Dynamic Thick-to-Thin Brush Stroke Wing of 'V' -->
  <path d="M 396 152 
           C 382 152, 370 162, 358 182 
           L 256 376 
           L 294 376 
           L 376 212 
           C 388 188, 396 174, 404 168 
           Z" 
        fill="url(#goldGrad)"/>

  <!-- Center Heart-Diamond Fine Art Jewel Accent -->
  <polygon points="256,192 272,216 256,240 240,216" fill="url(#goldGrad)"/>
  <circle cx="256" cy="216" r="3" fill="#ffffff"/>

  <!-- Subtle Top Sheen Reflection -->
  <path d="M 32 120 C 32 68, 68 32, 120 32 L 392 32 C 444 32, 480 68, 480 120 C 480 170, 360 210, 256 210 C 152 210, 32 170, 32 120 Z" fill="url(#reflectionGrad)"/>
</svg>
